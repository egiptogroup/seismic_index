<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --magma: #ff3300;
            --font-body: 'Arial', sans-serif;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-body);
        }

        .preview-container {
            background: rgba(15, 15, 20, 0.95);
            border: 2px solid var(--magma);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 51, 0, 0.4);
        }

        h1 {
            color: var(--magma);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .export-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid rgba(255, 51, 0, 0.3);
        }

        .export-title {
            color: var(--magma);
            font-size: 1.1rem;
            margin: 0 0 20px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* Export Buttons - Premium Design */
        .action-btn {
            color: white;
            padding: 16px 32px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 1.05rem;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-width: 160px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: none;
        }

        /* PDF Button - Red Theme */
        .action-btn:nth-child(1) {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        .action-btn:nth-child(1):hover {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.6);
        }

        .action-btn:nth-child(1)::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .action-btn:nth-child(1):hover::before {
            left: 100%;
        }

        /* Excel Button - Green Theme */
        .action-btn:nth-child(2) {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .action-btn:nth-child(2):hover {
            background: linear-gradient(135deg, #1e8449 0%, #27ae60 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.6);
        }

        .action-btn:nth-child(2)::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .action-btn:nth-child(2):hover::before {
            left: 100%;
        }

        /* Image Button - Blue Theme */
        .action-btn:nth-child(3) {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .action-btn:nth-child(3):hover {
            background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.6);
        }

        .action-btn:nth-child(3)::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .action-btn:nth-child(3):hover::before {
            left: 100%;
        }

        /* Active state for all buttons */
        .action-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* Icon styling */
        .action-btn i {
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Text styling */
        .action-btn span {
            font-weight: 700;
            letter-spacing: 1.2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="preview-container">
        <h1>🎨 Button Preview</h1>

        <div class="export-section">
            <h3 class="export-title">📥 Export Options</h3>
            <div class="modal-actions">
                <button class="action-btn" onclick="alert('PDF Button Clicked!')">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF Report</span>
                </button>
                <button class="action-btn" onclick="alert('Excel Button Clicked!')">
                    <i class="fas fa-file-excel"></i>
                    <span>Excel Data</span>
                </button>
                <button class="action-btn" onclick="alert('Image Button Clicked!')">
                    <i class="fas fa-camera"></i>
                    <span>Map Image</span>
                </button>
            </div>
        </div>

        <div style="color: #888; text-align: center; margin-top: 30px; font-size: 0.9rem;">
            ✨ Hover على الأزرار لترى التأثيرات
        </div>
    </div>
</body>

</html>
